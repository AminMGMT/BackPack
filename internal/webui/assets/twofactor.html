<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="__BASE_PATH__/manifest.json">
<link rel="icon" href="__BASE_PATH__/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="__BASE_PATH__/icon.svg">
<title>Backpack · Login</title>
<style>
  :root{
    --bg:#0a0a0b; --card:rgba(255,255,255,.045); --stroke:rgba(255,255,255,.09);
    --accent-rgb:255,69,58;
    --accent:rgb(var(--accent-rgb));
    --red:var(--accent);
    --red-soft:color-mix(in srgb, var(--accent) 60%, #fff);
    --red-deep:color-mix(in srgb, var(--accent) 68%, #000);
    --txt:#f5f5f7; --muted:#9a9aa0; --radius:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
    background:var(--bg); color:var(--txt);
    display:grid; place-items:center; overflow:hidden; -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  :focus-visible{outline:2px solid var(--red);outline-offset:3px}

  .glow{position:fixed;inset:0;z-index:0;filter:blur(90px);opacity:.6}
  .glow::before,.glow::after{content:"";position:absolute;border-radius:50%}
  .glow::before{width:520px;height:520px;background:radial-gradient(circle,var(--red-deep),transparent 65%);
    top:-160px;left:-120px;animation:float1 14s ease-in-out infinite}
  .glow::after{width:420px;height:420px;background:radial-gradient(circle,#7a0d08,transparent 65%);
    bottom:-140px;right:-100px;animation:float2 18s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(120px,80px) scale(1.15)}}
  @keyframes float2{50%{transform:translate(-100px,-60px) scale(1.1)}}

  .card{
    position:relative;z-index:1;width:min(92vw,380px);padding:44px 34px 30px;
    background:var(--card);border:1px solid var(--stroke);border-radius:var(--radius);
    backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    text-align:center;animation:rise .7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
  .logo{
    width:66px;height:66px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,var(--red),var(--red-deep));
    box-shadow:0 10px 30px rgba(var(--accent-rgb),.45), inset 0 1px 0 rgba(255,255,255,.4);
    animation:pop .8s cubic-bezier(.16,1,.3,1) .1s both;
  }
  .logo .ic{width:32px;height:32px}
  @keyframes pop{from{opacity:0;transform:scale(.5) rotate(-12deg)}}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:6px 0 26px}

  form{display:flex;flex-direction:column;gap:14px}
  .field{position:relative;display:flex;align-items:center}
  input{
    width:100%;padding:16px 52px 16px 18px;font-size:20px;letter-spacing:.5em;text-align:center;
    color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    border-radius:16px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s;
    font-variant-numeric:tabular-nums;
  }
  input::placeholder{letter-spacing:.2em;color:#5a5a5f}
  input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.18);background:rgba(255,255,255,.07)}
  .toggle{position:absolute;right:8px;width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;
    background:transparent;color:var(--muted);display:grid;place-items:center;transition:color .2s}
  .toggle:hover{color:var(--red-soft)}
  button[type=submit]{
    min-height:52px;padding:0 16px;font-size:16px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(145deg,var(--red),var(--red-deep));border:none;border-radius:16px;
    transition:transform .25s,box-shadow .25s;box-shadow:0 10px 26px rgba(var(--accent-rgb),.35);touch-action:manipulation;
  }
  button[type=submit]:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(var(--accent-rgb),.5)}
  button[type=submit]:active{transform:translateY(0) scale(.99)}
  .foot{margin-top:22px;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
  .foot b{color:var(--red-soft);font-weight:600}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  .foot.bp-attrib{opacity:.62;font-size:11.5px;margin-top:6px;line-height:1.5}
  .foot.bp-attrib a{color:inherit}
  .hintline{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/><path d="M12 14v2"/></svg>
    </div>
    <h1>Backpack</h1>
    <div class="sub" id="sub">Enter the code from your authenticator app</div>
    <form method="post" action="__BASE_PATH__/login">
      <label class="sr-only" for="code" id="codelabel">Two-factor code</label>
      <div class="field">
        <input id="code" name="code" type="text" maxlength="24"
               placeholder="000000" autofocus autocomplete="one-time-code"
               inputmode="numeric" required>
      </div>
      <button type="submit" id="unlock">Verify</button>
    </form>
    <div class="hintline" id="hint">Lost the phone? A recovery code works here too.</div>
    <div class="foot">TeleGram <b>@BlackProtocols</b> · GitHub <b>AminMGMT</b></div>
    <!-- The Appropriate Legal Notice AGPL-3.0 section 13 asks a network
         service to show the people interacting with it, and the attribution
         NOTICE requires a modified version to keep. -->
    <div class="foot bp-attrib">Based on BackPack by Amin Mohammadi (AminMGMT)<br>
      <a href="https://github.com/AminMGMT/BackPack" rel="noreferrer">source</a> · AGPL-3.0</div>
  </div>
<script nonce="__CSP_NONCE__">
  // The accent chosen in the panel applies here too, for the same reason it
  // does on the password page: a second step in a different colour reads as a
  // different product, which is exactly the wrong feeling on a login.
  (function(){
    const A={ember:'255,69,58',pomegranate:'231,29,54',saffron:'247,181,56',
             pistachio:'127,184,0',turquoise:'65,187,217',frost:'173,202,214'};
    try{
      const v=A[localStorage.getItem('bp_accent')];
      if(v) document.documentElement.style.setProperty('--accent-rgb',v);
    }catch(e){}
  })();
</script>
<script nonce="__CSP_NONCE__">
(function(){
  if(localStorage.getItem('bp_lang')!=='fa') return;
  document.documentElement.lang='fa';
  document.documentElement.dir='rtl';
  const set=(id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set('sub','کدی که اپلیکیشن authenticator نشان می‌دهد را وارد کن');
  set('codelabel','کد دو مرحله‌ای');
  set('unlock','تأیید');
  set('hint','گوشی را از دست داده‌ای؟ یکی از کدهای بازیابی هم اینجا کار می‌کند.');
  const c=document.getElementById('code');
  if(c){ c.style.direction='ltr'; c.style.textAlign='center'; }
})();
</script>
</body>
</html>
