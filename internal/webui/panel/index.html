<!doctype html>
<html lang="en" data-base="__BASE_PATH__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backpack</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070707">
<link rel="icon" href="__BASE_PATH__/icon.svg" type="image/svg+xml">
<link rel="manifest" href="__BASE_PATH__/manifest.json">
<link rel="apple-touch-icon" href="__BASE_PATH__/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backpack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components/header.css">
<link rel="stylesheet" href="css/components/dock.css">
<link rel="stylesheet" href="css/components/servers.css">
<link rel="stylesheet" href="css/screens/overview.css">
<link rel="stylesheet" href="css/components/resources.css">
<link rel="stylesheet" href="css/components/card.css">
<link rel="stylesheet" href="css/wide.css">
<link rel="stylesheet" href="css/accent.css">
<link rel="stylesheet" href="css/components/dialog.css">
<link rel="stylesheet" href="css/components/toast.css">
<link rel="stylesheet" href="css/screens/tools.css">
<link rel="stylesheet" href="css/vendor/xterm.css">

<script nonce="__CSP_NONCE__">
  /* Theme + accent before first paint so a dark panel never flashes white. */
  try {
    var t = localStorage.getItem('bp_theme') || 'dark';
    var a = localStorage.getItem('bp_accent') || 'none';
    document.documentElement.dataset.t = t;
    if (a && a !== 'none') document.documentElement.dataset.accent = a;
    document.addEventListener('DOMContentLoaded', function () {
      document.body.dataset.t = t;
    });
  } catch (e) {}
</script>
</head>

<body data-t="dark" class="wide">

<!-- The ground the panel sits on.
     Bars across the width, tallest at the edges and shortest in the middle,
     each a gradient of the accent fading upward — so the page has a horizon
     rather than a flat field. It is built on --ac, which is what the accent
     picker sets, so choosing a different one repaints this with it and no
     script is involved. Inert: it is behind everything and takes no pointer. -->
<div class="bgbars" aria-hidden="true"><i style="--s:1.000;--d:0.0s"></i><i style="--s:0.882;--d:0.1s"></i><i style="--s:0.767;--d:0.2s"></i><i style="--s:0.658;--d:0.3s"></i><i style="--s:0.553;--d:0.4s"></i><i style="--s:0.456;--d:0.5s"></i><i style="--s:0.368;--d:0.6s"></i><i style="--s:0.300;--d:0.7s"></i><i style="--s:0.368;--d:0.8s"></i><i style="--s:0.456;--d:0.9s"></i><i style="--s:0.553;--d:1.0s"></i><i style="--s:0.658;--d:1.1s"></i><i style="--s:0.767;--d:1.2s"></i><i style="--s:0.882;--d:1.3s"></i><i style="--s:1.000;--d:1.4s"></i></div>

<div id="boot">
  <div class="boot-stage">
    <div class="boot-mark">
      <svg class="ring" viewBox="0 0 66 66" aria-hidden="true">
        <circle class="trk" cx="33" cy="33" r="31"></circle>
        <circle class="arc" id="boot-arc" cx="33" cy="33" r="31"></circle>
      </svg>
      <span class="boot-in" data-icon="pack"></span>
    </div>
    <div class="boot-title">Backpack</div>
    <div class="boot-sub" id="boot-sub">Loading…</div>
    <div class="boot-reads">
      <div class="boot-read" id="read-stats"><span>/api/stats</span><span class="ln"><i></i></span></div>
      <div class="boot-read" id="read-tunnels"><span>/api/tunnels</span><span class="ln"><i></i></span></div>
    </div>
  </div>
</div>

<!-- .panel is the container the whole layout queries against, so it stays. -->
<div class="panel" id="panel" hidden>
  <div class="inner2">

    <div class="stickH">
      <div class="hz">
        <header class="HH">
          <div class="mk" data-icon="pack"></div>
          <div class="who"><b>Backpack</b><small id="hdr-sub">—</small></div>

          <span class="sp"></span>

          <button class="btn btn-ghost" id="appearance-btn" title="Appearance"
                  aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span class="t2">Appearance</span>
          </button>
          <button class="btn btn-ghost" id="install-btn" title="Install app" aria-label="Install app" hidden>
            <svg class="icon" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v7"/><path d="M9 11l3 3 3-3"/><path d="M10.5 18.5h3"/></svg>
          </button>
          <button class="btn btn-ghost" id="alerts-btn" title="Alerts" aria-label="Alerts">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="badge badge-wr" id="alerts-bdg" hidden></span>
          </button>
          <a class="btn btn-ghost" id="logout-btn" href="__BASE_PATH__/logout" title="Log out" aria-label="Log out">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </a>
        </header>
      </div>
    </div>

    <div class="warnbar" id="warnbar" hidden>
      <div class="ic">!</div>
      <div class="tx">
        <b>The monitor service is not running</b>
        <span>The watchdog, the bot and the alerts live in it. Tunnels keep carrying traffic, but a
              tunnel that drops will not be restarted and no alert will reach you.</span>
      </div>
      <button class="btn btn-secondary">Start it</button>
    </div>

    <!-- This machine, on every section. See js/ui/strip.js. -->
    <div id="strip"></div>

    <div class="dockZ">
      <div class="dock" id="dock" role="tablist" aria-label="Sections">
        <button data-dock="/" role="tab" aria-selected="true">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span>Overview</span><span class="badge badge-neutral" id="dock-o"></span>
        </button>
        <!-- Servers is out of the dock for now (the fleet is being reworked);
             its screen is still in js/views/servers.js. -->
        <button data-dock="/conntest" role="tab" aria-selected="false">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.2 12h2.3M11 12h2M14.5 12h2.3"/><path d="M12 5v2M12 17v2"/></svg>
          <span>Connection test</span><span class="badge badge-info live" id="dock-c"></span>
        </button>
        <button data-dock="/tunnels" role="tab" aria-selected="false">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 12h4l3-7 3 14 3-7h3"/></svg>
          <span>Tunnels</span><span class="badge badge-neutral" id="dock-t"></span>
        </button>
        <button data-dock="/terminal" role="tab" aria-selected="false">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3"/><path d="M12.5 15H17"/></svg>
          <span>Terminal</span>
        </button>
        <button data-dock="/manage" role="tab" aria-selected="false">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>
          <span>Manage</span>
        </button>
      </div>
    </div>

    <div id="view"></div>
  </div>
</div>

<div class="appear" id="appearance" hidden role="dialog" aria-modal="false"
     aria-label="Appearance">
  <h4 class="t-sm c-dim">Theme</h4>
  <div class="seg" id="ap-theme" role="radiogroup" aria-label="Theme">
    <button class="btn btn-secondary" data-theme="dark" role="radio" aria-checked="true">Dark</button>
    <button class="btn btn-secondary" data-theme="light" role="radio" aria-checked="false">Light</button>
  </div>
  <h4 class="t-sm c-dim mt-4">Accent</h4>
  <div class="dots" id="ap-accent" role="radiogroup" aria-label="Accent color">
    <button class="btn btn-ghost" data-a="none" title="None" aria-label="None accent" role="radio" aria-checked="true"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <button class="btn btn-ghost" data-a="crimson" style="--c:#4f000b" title="Crimson" aria-label="Crimson accent" role="radio" aria-checked="false"></button>
    <button class="btn btn-ghost" data-a="ember"   style="--c:#f6511d" title="Ember" aria-label="Ember accent" role="radio" aria-checked="false"></button>
    <button class="btn btn-ghost" data-a="lime"    style="--c:#7fb800" title="Lime" aria-label="Lime accent" role="radio" aria-checked="false"></button>
    <button class="btn btn-ghost" data-a="azure"   style="--c:#41bbd9" title="Azure" aria-label="Azure accent" role="radio" aria-checked="false"></button>
  </div>
</div>

<div class="toastZ" id="toast" role="status" aria-live="polite">
  <span class="ic" id="toast-ic"></span>
  <span class="tx" id="toast-tx"></span>
  <span class="life"><i></i></span>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
