# staticcheck, with three checks off and the reasons written down.
#
# Both are cases where the check is right in general and wrong here, and both
# would otherwise be "fixed" by making the code worse.

checks = ["inherit", "-ST1018", "-ST1005", "-SA1019"]

# -ST1018 — "string literal contains Unicode format characters".
#
# It is flagging U+200C, the zero-width non-joiner, in internal/telegram/lang.go.
# Persian needs it: it is what keeps "می‌شود" from being rendered as "میشود",
# and it appears in ordinary words throughout the bot's Persian strings. The
# check's suggestion is to write ‌ escapes instead, which would turn every
# readable Persian sentence in that file into an unreadable one and guarantee
# the next person editing it gets the spacing wrong.
#
# The character is not invisible here by accident — it is a letter of the
# language this product is written for.

# -ST1005 — "error strings should not be capitalized".
#
# Right for "Failed to open"; wrong for "Let's Encrypt cannot issue a
# certificate for an IP address", where the capital belongs to a proper noun.
# The check cannot tell the two apart and this codebase writes error messages
# as sentences addressed to an operator, several of which begin with a name.

# -SA1019 — "deprecated".
#
# kcp-go deprecated SetStreamMode and offers nothing in its place: the setting
# still exists, still does what the tunnel needs, and the upstream note says
# only that the API may move. Removing the call would change the transport's
# behaviour to avoid a warning about an API that still works.
#
# Worth revisiting when kcp-go says what to use instead.
